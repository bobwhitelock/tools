<!DOCTYPE html>
<!--
  THROWAWAY SPIKE v2 — not part of the app.
  v1 found: compile() returns graph{objects,edges,ast} with ast "range" fields;
  a generic d2.sendMessage + reachable d2.worker exist; but the rendered SVG
  showed no g[id] elements. v2 settles:
    A) the worker message protocol (can we call getRefRanges / getObjOrder?)
    B) the exact shape of ast ranges + object.references (for text-edit mapping)
    C) whether the rendered SVG actually tags nodes/edges with ids/classes
  Results render on-page; screenshot/paste to report back.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>D2 WASM internals spike v2</title>
<style>
  body { margin:0; background:#0d1117; color:#c9d1d9; font:12.5px/1.5 'SF Mono','Fira Code',Consolas,monospace; }
  header { padding:12px 16px; background:#161b22; border-bottom:1px solid #30363d; }
  header h1 { margin:0; font-size:15px; }
  header .sub { color:#8b949e; font-size:12px; margin-top:4px; }
  #log { padding:12px 16px; white-space:pre-wrap; word-break:break-word; }
  .h  { color:#58a6ff; font-weight:bold; margin-top:18px; display:block; border-bottom:1px solid #30363d; padding-bottom:3px; }
  .ok { color:#3fb950; } .no { color:#f85149; } .dim{ color:#8b949e; } .v { color:#d2a8ff; } .y { color:#e3b341; }
</style>
</head>
<body>
<header>
  <h1>D2 WASM internals spike v2</h1>
  <div class="sub">Probes the worker protocol, range/reference shapes, and SVG ids.</div>
</header>
<div id="log">Loading @terrastruct/d2 from esm.sh …</div>

<script type="module">
  const logEl = document.getElementById('log');
  logEl.textContent = '';
  function out(s='', cls) {
    const span = document.createElement('span');
    if (cls) span.className = cls;
    span.textContent = s + '\n';
    logEl.appendChild(span);
    if (cls === 'no') console.error(s); else console.log(s);
  }
  const H = (s) => out('\n### ' + s, 'h');
  function brief(v, depth=3) {
    const seen = new WeakSet();
    function walk(x, d) {
      if (x === null || typeof x !== 'object') return x;
      if (seen.has(x)) return '[circular]';
      seen.add(x);
      if (d <= 0) return Array.isArray(x) ? `[Array(${x.length})]` : '[Object]';
      if (Array.isArray(x)) return x.slice(0,6).map(e=>walk(e,d-1)).concat(x.length>6?[`…+${x.length-6}`]:[]);
      const o={}; for (const k of Object.keys(x).slice(0,60)) { try{o[k]=walk(x[k],d-1);}catch{o[k]='[?]';} } return o;
    }
    try { return JSON.stringify(walk(v, depth), null, 2); } catch(e){ return String(v); }
  }
  const withTimeout = (p, ms=4000) => Promise.race([
    Promise.resolve(p),
    new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout '+ms+'ms')), ms))
  ]);

  const SOURCE =
`web: Web Browser
api: API Server {shape: hexagon}
db: Database {shape: cylinder}
cache: Cache {shape: cloud}

web -> api: HTTP
api -> db: Query
api -> cache: Read/Write
cache -> db: Sync
api.style.fill: "#eee"
`;

  let mod, D2, d2;
  try { mod = await import('https://esm.sh/@terrastruct/d2'); D2 = mod.D2; d2 = new D2(); }
  catch (e) { out('import/new D2 failed: ' + e, 'no'); throw e; }

  // ── A. Message protocol — read the actual method bodies ─────────────────────
  H('A. Worker message protocol (method source)');
  for (const m of ['compile','render','encode','decode','sendMessage','setupMessageHandler','init']) {
    try {
      const src = d2[m].toString();
      out(`\n— d2.${m} —`, 'y');
      out(src.length > 1200 ? src.slice(0,1200) + '  …[truncated]' : src, 'dim');
    } catch (e) { out(`d2.${m}.toString() failed: ${e}`, 'no'); }
  }

  // Ensure worker is booted, then inspect it.
  let compiled;
  try { compiled = await d2.compile(SOURCE); out('\ncompile() ok (worker booted).', 'ok'); }
  catch (e) { out('compile() failed: ' + e, 'no'); }

  // ── B. Try to call internal funcs through sendMessage ───────────────────────
  H('B. Attempt getRefRanges / getObjOrder via sendMessage');
  out('We try several call conventions; one resolving (not "unknown action") = reachable.', 'dim');

  // Candidate argument shapes — we do not know the exact protocol, so try many.
  const fsObj = { 'index': SOURCE };
  const attempts = [
    ['sendMessage("getRefRanges", [fs,"index","","api"])', () => d2.sendMessage('getRefRanges', [fsObj,'index','','api'])],
    ['sendMessage("getRefRanges", {fs,file:"index",boardPath:"",key:"api"})', () => d2.sendMessage('getRefRanges', {fs:fsObj, file:'index', boardPath:'', key:'api'})],
    ['sendMessage("getRefRanges", ["index","api"])', () => d2.sendMessage('getRefRanges', ['index','api'])],
    ['sendMessage("getRefRanges", [SOURCE,"api"])', () => d2.sendMessage('getRefRanges', [SOURCE,'api'])],
    ['sendMessage("getObjOrder", [fs,"index",""])', () => d2.sendMessage('getObjOrder', [fsObj,'index',''])],
    ['sendMessage("getObjOrder", [SOURCE])', () => d2.sendMessage('getObjOrder', [SOURCE])],
    ['sendMessage("getVersion", [])', () => d2.sendMessage('getVersion', [])],     // sanity: known-good action name?
  ];
  for (const [label, fn] of attempts) {
    try {
      const r = await withTimeout(fn(), 4000);
      out(`✓ ${label}`, 'ok');
      out('   -> ' + brief(r, 4).slice(0, 1500), 'v');
    } catch (e) {
      out(`✗ ${label}  — ${String(e).slice(0,160)}`, 'no');
    }
  }

  // ── C. Shape of ast ranges + object.references (A2 fallback detail) ──────────
  H('C. AST range + references shapes (for text-edit mapping)');
  if (compiled?.graph) {
    const o = compiled.graph.objects?.find(x => x.id === 'api') || compiled.graph.objects?.[0];
    out('object "api".references (depth 5):', 'y');
    out(brief(o?.references, 5), 'dim');

    // Walk the AST to find the first node carrying a "range" and print it.
    const astStr = JSON.stringify(compiled.graph.ast);
    out('\nast total size (chars): ' + astStr.length, 'dim');
    // pretty-print the top of the AST so we can see range structure in context
    out('\ngraph.ast (depth 4, head):', 'y');
    out(brief(compiled.graph.ast, 4).slice(0, 3000), 'dim');

    // Extract a couple of raw "range":... snippets verbatim to see exact encoding.
    const m = astStr.match(/"range":[^}]*\}(?:[^}]*\})?/g);
    if (m) { out('\nverbatim "range" snippets (first 4):', 'y'); m.slice(0,4).forEach(s=>out('  '+s, 'v')); }
    else   { out('\nno "range":{...} object pattern found (may be a string/array form)', 'no'); }
  }

  // ── D. SVG ids/classes — settle the read-mapping question ───────────────────
  H('D. Rendered SVG structure (ids / classes on shapes)');
  try {
    const svg = await d2.render(compiled.diagram, compiled.renderOptions);
    out('raw SVG length: ' + svg.length, 'dim');
    out('count of id=" : ' + (svg.match(/\bid="/g)||[]).length);
    out('count of class=" : ' + (svg.match(/\bclass="/g)||[]).length);
    out('count of <g : ' + (svg.match(/<g\b/g)||[]).length);

    // Parse and list every <g> with its id + class, regardless of namespace.
    const doc = new DOMParser().parseFromString(svg, 'image/svg+xml');
    const perr = doc.querySelector('parsererror');
    if (perr) out('SVG parse error: ' + perr.textContent.slice(0,200), 'no');
    const gs = doc.getElementsByTagName('g');
    out('\n<g> elements: ' + gs.length + ' (showing id/class for each):');
    for (let i=0;i<gs.length;i++){
      const g = gs[i];
      const id = g.getAttribute('id');
      const cl = g.getAttribute('class');
      if (id || cl) out(`  g[${i}] id=${JSON.stringify(id)} class=${JSON.stringify(cl)}`, id ? 'v' : 'dim');
    }

    // Also dump a head + a representative slice of raw markup so we can see the
    // real element wrapping a node label (e.g. does <rect>/<text> carry data-*?).
    out('\nraw SVG head (first 1600 chars):', 'y');
    out(svg.slice(0, 1600), 'dim');

    // Find the slice around the text "API Server" to see how a node is wrapped.
    const idx = svg.indexOf('API Server');
    if (idx >= 0) {
      out('\nmarkup around an "api" node label (±400 chars):', 'y');
      out(svg.slice(Math.max(0,idx-400), idx+200), 'dim');
    }
  } catch (e) { out('render() failed: ' + e, 'no'); }

  H('DONE'); out('Screenshot/paste everything above to report back.');
</script>
</body>
</html>
